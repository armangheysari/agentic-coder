[project]
name = "engineering_team"
version = "0.1.0"
description = "Multi-agent engineering team on the OpenAI Agents SDK"
authors = [{ name = "Arman", email = "toopak64@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.50.0",
    "openai-agents>=0.20.0",
    "python-dotenv",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_team"]
